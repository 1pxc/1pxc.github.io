<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hello World — 1pxc Blog">
    <title>Hello World — 1pxc</title>
    <style>
        :root {
            --bg: #0d0d0d;
            --surface: #1a1a1a;
            --surface-hover: #242424;
            --text: #e0e0e0;
            --text-muted: #888;
            --accent: #64b5f6;
            --accent-dim: rgba(100, 181, 246, 0.12);
            --border: #2a2a2a;
            --radius: 8px;
            --max-w: 680px;
            --font-mono: "SF Mono", "Fira Code", "Cascadia Code", Consolas, monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
        }

        a { color: var(--accent); text-decoration: none; transition: opacity 0.2s; }
        a:hover { opacity: 0.75; }

        .container { max-width: var(--max-w); margin: 0 auto; padding: 0 24px; }

        /* ── Navigation ── */
        .nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 20;
            backdrop-filter: blur(12px);
            background: rgba(13, 13, 13, 0.85);
            border-bottom: 1px solid var(--border);
        }
        .nav .container { display: flex; align-items: center; justify-content: space-between; height: 56px; }
        .nav-logo { font-weight: 700; font-size: 18px; color: var(--text); letter-spacing: -0.5px; }
        .nav-links { display: flex; gap: 28px; list-style: none; }
        .nav-links a { color: var(--text-muted); font-size: 14px; font-weight: 500; transition: color 0.2s; }
        .nav-links a:hover { color: var(--text); opacity: 1; }
        .nav-links a.active { color: var(--text); }

        /* ── Post ── */
        .post {
            padding: 100px 0 64px;
        }
        .post-header {
            margin-bottom: 40px;
        }
        .post-date {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .post-header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.3;
            margin-bottom: 4px;
        }
        .post-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 12px;
            transition: color 0.2s;
        }
        .post-back:hover { color: var(--text); opacity: 1; }
        .post-back .arrow { font-size: 16px; }

        .post-body h2 {
            font-size: 18px;
            font-weight: 600;
            margin: 36px 0 12px;
            color: var(--text);
        }
        .post-body p {
            color: var(--text-muted);
            margin-bottom: 16px;
            font-size: 15px;
            line-height: 1.8;
        }
        .post-body blockquote {
            border-left: 3px solid var(--accent);
            padding: 8px 20px;
            margin: 24px 0;
            color: var(--accent);
            font-style: italic;
        }
        .post-body hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 32px 0;
        }

        /* ── Footer ── */
        .footer {
            border-top: 1px solid var(--border);
            padding: 32px 0;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .post { padding: 80px 0 40px; }
            .post-header h1 { font-size: 22px; }
            .nav-links { gap: 18px; }
        }
    </style>
</head>
<body>

    <nav class="nav">
        <div class="container">
            <a href="/" class="nav-logo">1pxc</a>
            <ul class="nav-links">
                <li><a href="/" class="active">Blog</a></li>
                <li><a href="/projects/">Projects</a></li>
                <li><a href="https://github.com/1pxc" target="_blank" rel="noopener">GitHub</a></li>
            </ul>
        </div>
    </nav>

    <article class="post">
        <div class="container">
            <header class="post-header">
                <div class="post-date">2026-06-16</div>
                <h1>Hello World</h1>
                <a href="/" class="post-back">
                    <span class="arrow">&larr;</span> Back to Blog
                </a>
            </header>

            <div class="post-body">
                <p>
                    这是第一篇博客文章。从这里开始记录想法、技术与生活。
                </p>

                <hr>

                <h2>关于本站</h2>
                <p>
                    使用纯 HTML/CSS 构建，托管于 GitHub Pages。深色模式，极简设计。
                </p>

                <hr>

                <blockquote>
                    思考、构建、记录。
                </blockquote>
            </div>
        </div>
    </article>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 1pxc</p>
        </div>
    </footer>

</body>
</html>
