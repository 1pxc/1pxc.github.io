<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="1pxc - Projects">
    <title>Projects — 1pxc</title>
    <style>
        :root {
            --bg: #0d0d0d;
            --surface: #1a1a1a;
            --surface-hover: #242424;
            --text: #e0e0e0;
            --text-muted: #888;
            --accent: #64b5f6;
            --accent-dim: rgba(100, 181, 246, 0.12);
            --border: #2a2a2a;
            --radius: 8px;
            --max-w: 680px;
            --font-mono: "SF Mono", "Fira Code", "Cascadia Code", Consolas, monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
        }

        a { color: var(--accent); text-decoration: none; transition: opacity 0.2s; }
        a:hover { opacity: 0.75; }

        .container { max-width: var(--max-w); margin: 0 auto; padding: 0 24px; }

        .nav {
            position: sticky; top: 0; z-index: 10;
            backdrop-filter: blur(12px);
            background: rgba(13, 13, 13, 0.8);
            border-bottom: 1px solid var(--border);
        }
        .nav .container { display: flex; align-items: center; justify-content: space-between; height: 56px; }
        .nav-logo { font-weight: 700; font-size: 18px; color: var(--text); letter-spacing: -0.5px; }
        .nav-links { display: flex; gap: 28px; list-style: none; }
        .nav-links a { color: var(--text-muted); font-size: 14px; font-weight: 500; transition: color 0.2s; }
        .nav-links a:hover { color: var(--text); opacity: 1; }
        .nav-links a.active { color: var(--text); }

        .section { padding: 80px 0 64px; }
        .section-title {
            font-size: 13px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 2px; color: var(--text-muted);
            margin-bottom: 32px; font-family: var(--font-mono);
        }

        .projects-grid { display: grid; gap: 12px; }
        .project-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 24px;
            transition: background 0.2s, border-color 0.2s;
            display: block; color: inherit;
        }
        .project-card:hover { background: var(--surface-hover); border-color: #3a3a3a; opacity: 1; }
        .project-card h2 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
        .project-card p { color: var(--text-muted); font-size: 14px; line-height: 1.6; }
        .project-card .meta {
            display: flex; align-items: center; gap: 12px;
            margin-top: 12px; font-size: 12px; color: var(--text-muted);
            font-family: var(--font-mono);
        }
        .project-card .tag {
            padding: 2px 8px; border-radius: 4px;
            background: var(--accent-dim); color: var(--accent);
            font-size: 11px; font-family: var(--font-sans); font-weight: 500;
        }
        .project-card:hover h2 { color: var(--accent); }

        .footer { border-top: 1px solid var(--border); padding: 32px 0; text-align: center; color: var(--text-muted); font-size: 13px; }

        @media (max-width: 600px) {
            .section { padding: 48px 0 40px; }
        }
    </style>
</head>
<body>

    <nav class="nav">
        <div class="container">
            <a href="/" class="nav-logo">1pxc</a>
            <ul class="nav-links">
                <li><a href="/">Blog</a></li>
                <li><a href="/projects/" class="active">Projects</a></li>
                <li><a href="https://github.com/1pxc" target="_blank" rel="noopener">GitHub</a></li>
            </ul>
        </div>
    </nav>

    <main class="section">
        <div class="container">
            <h1 class="section-title">/ Projects</h1>

            <div class="projects-grid">

                <!-- 涡旋光通信加密 Demo -->
                <a href="vortex_comm_demo.html" class="project-card">
                    <h2>涡旋光束光通信加密 Demo</h2>
                    <p>基于涡旋光物理特性的128通道并行编解码加密算法交互式演示，串行数据映射至轨道角动量模态实现高维编码。</p>
                    <div class="meta">
                        <span class="tag">Optics</span>
                        <span class="tag">Crypto</span>
                        <span>2026</span>
                    </div>
                </a>

            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 1pxc</p>
        </div>
    </footer>

</body>
</html>
